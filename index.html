/* 1u = 1px of the 390px-wide design, scaled to the phone's width (capped on large screens) */
:root{--u:min(calc(100vw / 390), 1.1px);--navy:#193963;--pink:#E64C71;--muted:#5B6B82;--line:#EDF1F6}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:#F4F7FB}
a{color:var(--navy);text-decoration:none;-webkit-tap-highlight-color:transparent}
a:hover{color:var(--pink)}
svg{display:block}

.card{position:relative;overflow:hidden;width:calc(390 * var(--u));min-height:100vh;min-height:100dvh;margin:0 auto;
  padding:calc(28 * var(--u) + env(safe-area-inset-top)) calc(24 * var(--u)) calc(32 * var(--u) + env(safe-area-inset-bottom));
  background:#F4F7FB;color:var(--navy);font-family:'Outfit','Century Gothic',sans-serif;
  display:flex;flex-direction:column;gap:calc(28 * var(--u))}
.bg-mark{position:absolute;right:calc(-190 * var(--u));top:calc(-30 * var(--u));width:calc(520 * var(--u));height:calc(354 * var(--u));opacity:.12;transform:rotate(-22deg);pointer-events:none}
.logo{position:relative;width:calc(240 * var(--u));height:calc(42 * var(--u))}

.hero{position:relative;display:flex;flex-direction:column;gap:calc(4 * var(--u));padding-top:calc(12 * var(--u))}
.name{font-weight:600;font-size:calc(34 * var(--u));line-height:calc(40 * var(--u));letter-spacing:calc(-.3 * var(--u))}
.role{font-weight:600;font-size:calc(20 * var(--u));line-height:calc(26 * var(--u));color:var(--pink)}
.tagline{font-size:calc(17 * var(--u));line-height:calc(24 * var(--u));color:#4A5A72;margin-top:calc(8 * var(--u))}

.actions{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(12 * var(--u))}
.action{display:flex;flex-direction:column;align-items:center;gap:calc(8 * var(--u));font-size:calc(14 * var(--u));line-height:calc(18 * var(--u));font-weight:500}
.action .dot{width:calc(56 * var(--u));height:calc(56 * var(--u));border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center}
.action .dot.pink{background:var(--pink)}
.action svg{width:calc(24 * var(--u));height:calc(24 * var(--u))}

.list{position:relative;background:#FFF;border:1px solid #E1E7F0;border-radius:calc(16 * var(--u));display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:calc(14 * var(--u));padding:calc(12 * var(--u)) calc(16 * var(--u));min-height:calc(60 * var(--u))}
.row + .row{border-top:1px solid var(--line)}
.list.tall .row{min-height:calc(68 * var(--u))}
.row .ico{flex:none;width:calc(40 * var(--u));height:calc(40 * var(--u));border-radius:50%;background:#FCEBF0;display:flex;align-items:center;justify-content:center}
.row .ico svg{width:calc(20 * var(--u));height:calc(20 * var(--u))}
.row .txt{display:flex;flex-direction:column;min-width:0}
.row .lbl{font-size:calc(13 * var(--u));line-height:calc(16 * var(--u));color:var(--muted)}
.list.tall .lbl{letter-spacing:calc(1.5 * var(--u));font-weight:600}
.row .val{font-size:calc(16 * var(--u));line-height:calc(22 * var(--u));font-weight:500;overflow-wrap:anywhere}

.scan{position:relative;overflow:hidden;border-radius:calc(20 * var(--u));background:var(--navy);padding:calc(24 * var(--u));display:flex;flex-direction:column;gap:calc(18 * var(--u))}
.scan .stripe{position:absolute;inset:0;background:var(--pink);clip-path:polygon(calc(100% - 12 * var(--u)) 0,100% 0,100% 100%,calc(4 * var(--u)) 100%)}
.scan h2{position:relative;margin:0;display:flex;align-items:center;gap:calc(10 * var(--u));color:#FFF;font-weight:600;font-size:calc(20 * var(--u));line-height:calc(28 * var(--u))}
.scan h2 svg{width:calc(24 * var(--u));height:calc(24 * var(--u))}
.qr{position:relative;background:#FFF;display:flex;flex-direction:column;align-items:center;font-weight:600;color:var(--navy)}
.qr.main{align-self:center;width:calc(230 * var(--u));padding:calc(14 * var(--u)) calc(14 * var(--u)) calc(10 * var(--u));border-radius:calc(14 * var(--u));gap:calc(8 * var(--u));font-size:calc(17 * var(--u));line-height:calc(22 * var(--u))}
.qr.main svg{width:calc(200 * var(--u));height:calc(200 * var(--u))}
.qr-pair{position:relative;display:flex;justify-content:center;gap:calc(16 * var(--u))}
.qr.small{width:calc(140 * var(--u));padding:calc(12 * var(--u)) calc(12 * var(--u)) calc(8 * var(--u));border-radius:calc(12 * var(--u));gap:calc(6 * var(--u));font-size:calc(15 * var(--u));line-height:calc(20 * var(--u))}
.qr.small svg{width:calc(116 * var(--u));height:calc(116 * var(--u))}
/* ---------- Tablet: float the card on a soft backdrop ---------- */
@media (min-width:640px){
html,body{background:#E6ECF4}
body{padding:48px 24px}
.card{min-height:0;border-radius:calc(28 * var(--u));box-shadow:0 24px 60px -24px rgba(25,57,99,.28),0 2px 6px rgba(25,57,99,.06);
padding:calc(36 * var(--u)) calc(32 * var(--u)) calc(36 * var(--u))}
.list{overflow:hidden}
.row{transition:background-color .15s}
.row:hover{background:#F8FAFD}
.action .dot{transition:transform .15s}
.action:hover .dot{transform:translateY(-2px)}
}

/* ---------- Desktop: two-column layout, QR panel on the right ---------- */
@media (min-width:980px){
:root{--u:min(calc((100vw - 96px) / 1040), 1.1px)}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px}
.card{width:calc(1040 * var(--u));margin:0;padding:calc(56 * var(--u));
display:grid;grid-template-columns:minmax(0,1fr) calc(380 * var(--u));
grid-template-areas:"logo scan" "hero scan" "actions scan" "list scan" "tall scan";
align-content:start;column-gap:calc(56 * var(--u));row-gap:calc(28 * var(--u))}
.bg-mark{right:auto;top:auto;left:calc(-200 * var(--u));bottom:calc(-150 * var(--u))}
.logo{grid-area:logo}
.hero{grid-area:hero;padding-top:calc(8 * var(--u))}
.name{font-size:calc(52 * var(--u));line-height:calc(58 * var(--u));letter-spacing:calc(-.8 * var(--u))}
.role{font-size:calc(22 * var(--u));line-height:calc(28 * var(--u))}
.tagline{font-size:calc(19 * var(--u));line-height:calc(26 * var(--u))}
.actions{grid-area:actions;display:flex;flex-wrap:wrap;gap:calc(12 * var(--u))}
.action{flex-direction:row;gap:calc(10 * var(--u));padding:calc(6 * var(--u)) calc(20 * var(--u)) calc(6 * var(--u)) calc(6 * var(--u));
background:#FFF;border:1px solid #E1E7F0;border-radius:999px;font-size:calc(15 * var(--u));transition:border-color .15s,box-shadow .15s}
.action:hover{border-color:#F3B6C5;box-shadow:0 6px 16px -8px rgba(230,76,113,.45)}
.action .dot{width:calc(40 * var(--u));height:calc(40 * var(--u))}
.action svg{width:calc(20 * var(--u));height:calc(20 * var(--u))}
.action:hover .dot{transform:none}
.list{grid-area:list}
.list.tall{grid-area:tall}
.scan{grid-area:scan;align-self:stretch;justify-content:center;padding:calc(32 * var(--u));gap:calc(22 * var(--u))}
